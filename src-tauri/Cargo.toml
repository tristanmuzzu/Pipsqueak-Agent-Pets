[package]
name = "pipsqueak"
version = "0.9.0"
description = "A desktop pet that shows what Claude Code and Codex are doing, in their own words."
authors = ["Tristan Rafe Muzzu"]
license = "MIT"
repository = "https://github.com/tristanmuzzu/Pipsqueak-Agent-Pets"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api pairs with `macOSPrivateApi` in tauri.conf.json; it is what
# makes the window actually transparent on macOS and is inert elsewhere.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
# preserve_order because the installer round-trips ~/.claude/settings.json, a
# hand-tuned file whose key order is the owner's, not ours to alphabetise.
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
# Used to set the window's input shape directly. Tauri's set_ignore_cursor_events
# is all-or-nothing, and the all-or-nothing choice is unusable here (see
# apply_input_shape in app.rs).
gtk = "0.18"
gdk = "0.18"
cairo-rs = "0.18"
